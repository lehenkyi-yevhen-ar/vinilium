name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the whole history: a secret that was committed and removed is still a secret
          persist-credentials: false
      # Scans the history for committed secrets and fails the run on a finding. Free for a personal account; a repository that moves to an
      # ORGANISATION needs a (free) GITLEAKS_LICENSE secret, see the action's README. Pull-request comments are off so the job needs no
      # write permission; the findings are in the job log and summary.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
