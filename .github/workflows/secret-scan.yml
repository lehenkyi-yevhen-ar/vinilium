name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # Mondays: the whole history again, in case the rules changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests and pushes: gitleaks-action scans the commits of the PR (or the push) with the rules in .gitleaks.toml and the reviewed
  # exceptions in .gitleaksignore. Free for a personal account; a repository that moves to an ORGANISATION needs a (free) GITLEAKS_LICENSE
  # secret, and until it has one this job says so and skips instead of failing.
  gitleaks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that the action can run for this owner
        id: plan
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          if [ "$OWNER_TYPE" = "Organization" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=gitleaks-action skipped::The repository belongs to an organisation: gitleaks-action then needs a GITLEAKS_LICENSE secret (free, see its README). The full-history job below still scans with the open-source binary."
            echo "### gitleaks-action skipped (organisation-owned repository, no licence). The full-history job still runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action needs the commits of the PR range
          persist-credentials: false
      # Pull-request comments are off so the job needs no write permission; the findings are in the job log and summary.
      - if: steps.plan.outputs.run == 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  # The WHOLE history, on every push to main, weekly, and on demand: the pinned open-source binary (version and sha256 below, checked before it
  # runs) with the same config. A pull request only sees its own commits; this is what notices something older. The report is redacted and the
  # summary lists counts, rule ids, files and short commit ids, never a value.
  full-history:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c # gitleaks_8.24.3_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned gitleaks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full history
        run: |
          set +e
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --report-format json --report-path gitleaks-report.json .
          status=$?
          set -e
          {
            echo "### gitleaks, full history (v${GITLEAKS_VERSION})"
            if [ "$status" -eq 0 ]; then
              echo "No leaks found."
            else
              echo "**$(jq length gitleaks-report.json) finding(s)** (values are redacted; fix the file, or review and add the exact fingerprint to \`.gitleaksignore\` with a reason):"
              echo
              jq -r '.[] | "- `\(.RuleID)` in `\(.File)` line \(.StartLine), commit `\(.Commit[0:8])`, fingerprint `\(.Fingerprint)`"' gitleaks-report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
