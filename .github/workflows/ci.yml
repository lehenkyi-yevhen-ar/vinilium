name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository. No job needs a secret.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a FULL commit SHA (the version is in the comment). Dependabot proposes updates to both.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests run on an embedded Postgres (PGlite): no database or secrets needed.
      - run: npm test

  audit:
    # scripts/audit-gate.ts: fails on any NEW high or critical advisory; an advisory passes (as a warning) only while it is on the reviewed,
    # expiring allowlist .audit-allowlist.json. Moderate findings are listed, never blocking. See docs/operations.md, section 18.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod

  e2e:
    # The whole browser suite, with NO secrets: a throwaway Postgres service container (reached through Neon's open-source websocket
    # proxy, because the app uses the Neon serverless driver), the MOCK Discogs and MOCK Brevo servers (fake credentials inside the
    # config), and a production build. It never touches a real database or a real API. See docs/operations.md, "CI".
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vinilium_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d vinilium_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
        env:
          # The proxy may only reach the Postgres service, nothing else.
          ALLOW_ADDR_REGEX: "^postgres:5432$"
          LOG_CONN_INFO: "true" # one line per connection (remote address and target, no credentials): read it if the database step fails
        ports:
          - 5433:80
    env:
      CI: "true"
      # The ONLY database the e2e suite uses (the suite refuses anything else). The host name is the service container's; the Neon
      # driver sends it to the proxy, which resolves it on the container network.
      DEV_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vinilium_e2e
      NEON_WS_PROXY: 127.0.0.1:5433/v1 # an address, not "localhost": no IPv6 or DNS doubt
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Playwright version (the browser cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system libraries only (browser restored from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Fail fast, naming the stage: (1) the proxy answers HTTP, (2) a websocket to it opens, (3) Postgres answers through it. Retries for
      # about 40 s while the service containers finish starting. See docs/operations.md, section 18.
      - name: Check the database path (proxy, websocket, Postgres)
        run: npx tsx scripts/ci-db-probe.ts
      - name: Apply the migrations (to the throwaway Postgres)
        run: npm run db:migrate

      # Playwright builds the app (`next build`), starts it and the mock servers, then runs every project in order.
      - name: Run the end-to-end suite
        run: npx playwright test

      - name: Show what failed (step summary)
        if: always()
        run: |
          {
            echo "### End-to-end run"
            if [ -f test-results/results.json ]; then
              echo "$(jq '[.. | objects | select(has("specs")) | .specs[]] | length' test-results/results.json) tests ran; $(jq '[.. | objects | select(has("specs")) | .specs[] | select(.ok==false)] | length' test-results/results.json) failed."
              echo
              jq -r '[.. | objects | select(has("specs")) | .specs[] | select(.ok==false) | "- `" + .file + "`: " + .title] | .[]' test-results/results.json | head -40
            else
              echo "No test results were written: the run stopped before the tests (see the failing step above)."
            fi
            echo
            echo "Traces, screenshots and the HTML report are uploaded as the artifact **playwright-failure-${{ github.run_id }}** when the run fails (open playwright-report/index.html, or \`npx playwright show-trace <trace.zip>\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Service container logs (database path failures)
        if: failure()
        run: |
          for id in $(docker ps -a --format '{{.ID}}'); do
            name=$(docker inspect --format '{{.Name}} {{.Config.Image}}' "$id" | sed 's/@sha256.*//')
            echo "::group::docker logs $name"
            docker logs --tail 60 "$id" 2>&1 | sed -E 's#postgres(ql)?://[^ ]+#<redacted-url>#g' || true
            echo "::endgroup::"
          done
      - name: Upload the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
